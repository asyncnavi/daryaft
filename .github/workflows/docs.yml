name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes markdownlint-cli2@0.20.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_check_foundation.py
      - run: python scripts/check_foundation.py
